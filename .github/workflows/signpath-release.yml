name: Build and sign Windows release

run-name: Sign Windows release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and submit to SignPath
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: signpath-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign-windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Require SignPath enrollment configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          }

          $missing = $required.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
            ForEach-Object { $_.Key }

          if ($missing.Count -gt 0) {
            throw "SignPath enrollment is incomplete. Missing GitHub Actions settings: $($missing -join ', ')"
          }

      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and version
        id: release
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag -notmatch '^v[0-9A-Za-z][0-9A-Za-z.+-]*$') {
            throw "Release tag has an unsupported format: '$tag'"
          }

          $package = Get-Content -Raw release/app/package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($tag -ne $expectedTag) {
            throw "Requested tag '$tag' does not match package version '$expectedTag'."
          }

          $headTags = @(git tag --points-at HEAD)
          if ($headTags -notcontains $tag) {
            throw "Checked-out commit is not tagged '$tag'."
          }

          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "installer_name=LappenRecorder-Setup-$($package.version).exe" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix release/app
          npx electron-builder install-app-deps
          npm run build:dll

      - name: Build unsigned release installer
        run: npm run package

      - name: Locate and confirm unsigned installer
        id: unsigned
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "release/build/${{ steps.release.outputs.installer_name }}"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not produced: '$installer'"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Expected an unsigned build before SignPath submission, got: $($signature.Status)"
          }

          "path=$installer" >> $env:GITHUB_OUTPUT

      - name: Upload immutable unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ steps.release.outputs.installer_name }}
          path: ${{ steps.unsigned.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Submit installer to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signpath-signed
          parameters: |
            version: ${{ toJSON(steps.release.outputs.version) }}

      - name: Replace installer with signed result
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem '${{ runner.temp }}\signpath-signed' -Recurse -File -Filter '${{ steps.release.outputs.installer_name }}')
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed installer, found $($signed.Count)."
          }

          Copy-Item -LiteralPath $signed[0].FullName -Destination '${{ steps.unsigned.outputs.path }}' -Force

      - name: Verify signed publisher and timestamp
        shell: pwsh
        run: >-
          ./scripts/verify-windows-signature.ps1
          -Path '${{ steps.unsigned.outputs.path }}'
          -ExpectedPublisher 'SignPath Foundation'

      - name: Regenerate update metadata from signed installer
        run: >-
          node scripts/regenerate-signed-update-metadata.mjs
          --installer "${{ steps.unsigned.outputs.path }}"
          --metadata release/build/latest.yml
          --version "${{ steps.release.outputs.version }}"

      - name: Upload signed release bundle for review
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-${{ inputs.tag }}
          path: |
            release/build/${{ steps.release.outputs.installer_name }}
            release/build/${{ steps.release.outputs.installer_name }}.blockmap
            release/build/latest.yml
          if-no-files-found: error
          retention-days: 30
